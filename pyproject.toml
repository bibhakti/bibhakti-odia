[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bibhakti"
version = "0.0.1"
description = "Odia case-marker (bibhakti) utilities. Early release."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sapan" }]
keywords = ["odia", "oriya", "nlp", "morphology", "tokenization", "indic"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/bibhakti/bibhakti-odia"

[tool.hatch.build.targets.wheel]
packages = ["src/bibhakti"]
